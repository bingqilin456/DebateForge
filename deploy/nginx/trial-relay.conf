pid /tmp/nginx.pid;
error_log stderr notice;
worker_processes 1;

events {
    worker_connections 64;
}

stream {
    # 不接受客户端指定的转发地址，也不解密模型请求。
    map $ssl_preread_server_name $destination {
        default "";
        api.deepseek.com api.deepseek.com:443;
    }
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 3s;

    server {
        listen 8443;
        ssl_preread on;
        preread_timeout 5s;
        proxy_connect_timeout 5s;
        proxy_timeout 50s;
        proxy_next_upstream off;
        proxy_pass $destination;
    }
}
