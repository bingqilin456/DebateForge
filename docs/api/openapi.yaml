components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: siyige_session_dev
      description: 当前本地 HTTP 服务器的 Session Cookie。HTTPS 策略使用 __Host-siyige_session，客户端须切换对应名称；不使用 JWT/Bearer。
      x-https-cookie-name: __Host-siyige_session
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 要求 Session 的 POST 与 SessionCookie 同时提供；注册和登录不要求此头，所有 POST 仍要求合法 Origin。
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      description: 与服务器配置的完整 Origin（协议、主机、端口）严格相等；拒绝缺失、字符串 null 或不匹配值。开发值见示例，生产为配置的 HTTPS Origin。
      schema:
        type: string
      example: http://127.0.0.1:5173
    DebateId:
      name: id
      in: path
      required: true
      description: 当前用户的会话 ID；非法格式 400，不存在或非本人 404。
      schema:
        $ref: '#/components/schemas/EntityId'
      example: '123'
    TurnId:
      name: turn_id
      in: path
      required: true
      description: 所属会话的轮次 ID；非法格式 400，不存在或不属于当前会话 404。
      schema:
        $ref: '#/components/schemas/EntityId'
      example: '456'
    Page:
      name: page
      in: query
      required: false
      description: 分页页码，从 1 开始的正整数，默认 1。
      schema:
        $ref: '#/components/schemas/PositiveInteger'
      example: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: 每页条数，1–50 的正整数，默认 20。
      schema:
        type: integer
        minimum: 1
        maximum: 50
      example: 20
  headers:
    RequestId:
      description: 服务器生成的请求关联标识；有 JSON 信封时与 request_id 一致。
      schema:
        $ref: '#/components/schemas/RequestId'
    NoStore:
      description: 健康 Handler 与规划业务响应禁止缓存；当前路由层的 404/405/500 未统一设置此头。
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: 再次尝试前等待的秒数。
      schema:
        type: integer
        minimum: 0
    SessionCookie:
      description: 登录签发、退出清除。HTTP 开发为 siyige_session_dev；HTTPS 为 __Host-siyige_session 且 Secure。均 HttpOnly、SameSite=Lax、Path=/、无 Domain，固定 24 小时。退出使用同名同路径。
      schema:
        type: string
  schemas:
    EntityId:
      type: string
      pattern: ^[1-9][0-9]*$
      maxLength: 20
      description: 正整数十进制字符串，值须在 1–18446744073709551615（MySQL BIGINT UNSIGNED）内；上界由应用按数值校验。
      x-numeric-maximum: '18446744073709551615'
      examples:
      - '123'
    RequestId:
      type: string
      description: 服务器生成的关联标识；JSON 信封中的值与响应头 X-Request-ID 相同。
    UtcTime:
      type: string
      format: date-time
      description: UTC RFC 3339 时间。
      examples:
      - '2026-11-06T08:00:00Z'
    PositiveInteger:
      type: integer
      minimum: 1
    CompletedRounds:
      type: integer
      minimum: 0
      maximum: 4
      description: 已成功持久化的完成轮数。quick_3 范围 0–3、standard_4 范围 0–4，精确上限由会话 mode 决定；达到该上限后 status 置为 completed。
    DebateMode:
      type: string
      enum:
      - quick_3
      - standard_4
      description: 赛制模式，轮数上限的唯一事实来源。quick_3 为三轮（立论/攻辩/结辩，仅历史兼容与测试），standard_4 为四轮（立论/驳立论/自由辩/结辩，新建默认）。创建后不可修改。
    AIStyle:
      type: string
      enum:
      - logical
      - aggressive
      - empathic
      - data
      description: 陪练 AI 的辩手流派，logical 逻辑型、aggressive 进攻型、empathic 共情型、data 数据型；仅改变话术/论证风格，不改变轮次、立场、状态机或配额。Phase 3 目标允许创建时自主选择，创建后不可修改；历史读取保存值。当前 Phase 2 创建仍固定 logical，选择增量尚未实现。
    Stance:
      type: string
      enum:
      - pro
      - con
      description: pro 为正方，con 为反方。
    Credentials:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          description: 先去首尾空白，再转小写；归一化后 3–32 位，仅 ASCII 字母、数字、下划线。限制作用于归一化值，不能直接限制原始字符串长度。
        password:
          type: string
          writeOnly: true
          minLength: 12
          maxLength: 128
          x-max-utf8-bytes: 512
          description: 按原样校验，不 trim；12–128 个 Unicode 码点，且 UTF-8 最多 512 字节。
    User:
      type: object
      required:
      - id
      - username
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        username:
          type: string
          pattern: ^[a-z0-9_]{3,32}$
          description: 归一化后的用户名。
    AuthData:
      type: object
      required:
      - user
      - csrf_token
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
          description: 当前 Session 的独立 CSRF token；浏览器只在内存保存。
    Topic:
      type: object
      required:
      - id
      - title
      - description
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        title:
          type: string
        description:
          type: string
    CreateDebateRequest:
      type: object
      required:
      - topic_id
      - user_stance
      properties:
        topic_id:
          $ref: '#/components/schemas/EntityId'
        user_stance:
          $ref: '#/components/schemas/Stance'
        ai_style:
          $ref: '#/components/schemas/AIStyle'
          default: logical
          description: Phase 3 计划字段，尚未实现。仅省略时默认 logical；显式 null、空串、非字符串、未知值或大小写不符为 400 invalid_request，不创建会话；成功后持久化且不可修改。
          x-implementation-status: planned
          x-task: T14-STYLE
    Debate:
      type: object
      required:
      - id
      - topic
      - user_stance
      - ai_stance
      - mode
      - ai_style
      - total_rounds
      - status
      - completed_rounds
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        topic:
          $ref: '#/components/schemas/Topic'
        user_stance:
          $ref: '#/components/schemas/Stance'
        ai_stance:
          $ref: '#/components/schemas/Stance'
        mode:
          $ref: '#/components/schemas/DebateMode'
        ai_style:
          $ref: '#/components/schemas/AIStyle'
        total_rounds:
          type: integer
          minimum: 1
          maximum: 4
          description: 由 mode 推导，前端以此作为轮次上限，不得自行硬编码。quick_3 为 3、standard_4 为 4。
        status:
          type: string
          enum:
          - active
          - completed
          description: 创建为 active；达到该赛制轮数上限后成为 completed（quick_3 第 3 轮、standard_4 第 4 轮）。
        completed_rounds:
          $ref: '#/components/schemas/CompletedRounds'
        created_at:
          $ref: '#/components/schemas/UtcTime'
        updated_at:
          $ref: '#/components/schemas/UtcTime'
      description: topic 为创建时快照；ai_stance 必须与 user_stance 相反；赛制在创建后不可修改。
    SubmitTurnRequest:
      type: object
      required:
      - round_no
      - content
      - client_request_id
      properties:
        round_no:
          $ref: '#/components/schemas/PositiveInteger'
          description: 正整数；须满足 round_no = completed_rounds + 1，且不超过会话 mode 的轮数上限（standard_4 为 4、quick_3 为 3）；越界或不允许的状态/轮序为 409 round_conflict。
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: 1–2000 个 Unicode 码点；拒绝全空白，保存原文，不 trim。
        client_request_id:
          type: string
          format: uuid
          description: UUID，解析后统一为小写带连字符形式；同一会话内唯一。
    RetryTurnRequest:
      type: object
      required:
      - expected_attempt_version
      properties:
        expected_attempt_version:
          $ref: '#/components/schemas/PositiveInteger'
          description: 期望重试的失败轮次 attempt_version；必须为正整数且与当前失败轮次一致。
    SummaryRequest:
      type: object
      properties:
        retry:
          type: boolean
          default: false
          description: 默认 false；为 true 时必填 expected_attempt_version，not_started 时传 retry=true 返回 400。
        expected_attempt_version:
          $ref: '#/components/schemas/PositiveInteger'
          description: retry=true 时必填的正整数，必须与当前 failed 总结的 attempt_version 匹配。
    SummaryPoint:
      type: object
      required:
      - round_no
      - point
      - reason
      properties:
        round_no:
          type: integer
          minimum: 1
          maximum: 3
        point:
          type: string
          minLength: 1
          maxLength: 300
        reason:
          type: string
          minLength: 1
          maxLength: 300
    SummarySuggestion:
      type: object
      required:
      - round_no
      - action
      - example
      properties:
        round_no:
          type: integer
          minimum: 1
          maximum: 3
        action:
          type: string
          minLength: 1
          maxLength: 300
        example:
          type: string
          minLength: 1
          maxLength: 300
    SummaryContent:
      type: object
      required:
      - strengths
      - issues
      - suggestions
      properties:
        strengths:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/SummaryPoint'
        issues:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/SummaryPoint'
        suggestions:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/SummarySuggestion'
          scores:
            $ref: '#/components/schemas/TrainingDimensionScores'
      description: V1 只含三数组；V2（schema_version=2）增量增加 scores。
    TrainingDimensionScores:
      type: object
      required:
      - argumentation
      - rebuttal
      - logic
      - presentation
      properties:
        argumentation:
          type: integer
          minimum: 0
          maximum: 100
          description: 论证维度参考值。
        rebuttal:
          type: integer
          minimum: 0
          maximum: 100
          description: 反驳维度参考值。
        logic:
          type: integer
          minimum: 0
          maximum: 100
          description: 逻辑维度参考值。
        presentation:
          type: integer
          minimum: 0
          maximum: 100
          description: 表达维度参考值。
      additionalProperties: false
      description: 训练维度参考值。单场有效、不跨会话累计、不排名、不汇总为总分、不产生胜负、不用于任何评价或选拔；无综合总分与胜负字段。受 PRD 六条硬约束与 AC14 约束。
    Message:
      type: object
      required:
      - id
      - role
      - content
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        role:
          type: string
          enum:
          - user
          - assistant
        content:
          type: string
        created_at:
          $ref: '#/components/schemas/UtcTime'
    Turn:
      type: object
      required:
      - id
      - round_no
      - client_request_id
      - status
      - attempt_version
      - error_code
      - messages
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        round_no:
          $ref: '#/components/schemas/PositiveInteger'
        client_request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        status:
          type: string
          enum:
          - generating
          - completed
          - failed
        attempt_version:
          $ref: '#/components/schemas/PositiveInteger'
          description: 首轮新尝试从 1 开始；参与状态及版本条件写回。
        error_code:
          type:
          - string
          - 'null'
          enum:
          - null
          - model_error
          - model_timeout
          - model_unavailable
          - dependency_unavailable
          - generation_cancelled
          description: 已持久化的失败原因；无错误为 null。generation_cancelled 仅从详情读取，不是 HTTP 错误码。
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          description: 按同轮 user、assistant 排序；生成中或失败时保留 user 原文，完成后有正式 assistant 回复。
    SummaryStatus:
      type: object
      required:
      - status
      - attempt_version
      properties:
        status:
          type: string
          enum:
          - not_started
          - generating
          - completed
          - failed
        attempt_version:
          type:
          - integer
          - 'null'
          minimum: 1
        error_code:
          type: string
          enum:
          - model_error
          - model_timeout
          - model_unavailable
          - dependency_unavailable
          - generation_cancelled
        schema_version:
          type: integer
          enum:
          - 1
          - 2
          description: 判别式而非断言式。2 为增量升级，在三数组外增加 scores 四维参考值；客户端必须按此字段分支渲染，V1 只渲染三栏、隐藏四维，不得判为格式错误。
        content:
          $ref: '#/components/schemas/SummaryContent'
      description: 总结状态与可选结构化内容；not_started 时 attempt_version 为 null，completed 时含 schema_version 与 content，failed 时含 error_code。
    TurnResultData:
      type: object
      required:
      - turn
      - completed_rounds
      - query_url
      properties:
        turn:
          $ref: '#/components/schemas/Turn'
        completed_rounds:
          $ref: '#/components/schemas/CompletedRounds'
        query_url:
          type: string
          pattern: ^/api/v1/debates/[1-9][0-9]*$
          description: 相对会话详情查询地址。
    TurnFailureDetails:
      type: object
      required:
      - status
      - attempt_version
      - query_url
      properties:
        turn_id:
          $ref: '#/components/schemas/EntityId'
        status:
          type: string
          const: failed
        attempt_version:
          $ref: '#/components/schemas/PositiveInteger'
        query_url:
          type: string
          pattern: ^/api/v1/debates/[1-9][0-9]*(/summary)?$
    ErrorEnvelope:
      type: object
      required:
      - error
      - request_id
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - invalid_request
              - unauthenticated
              - invalid_credentials
              - csrf_failed
              - not_found
              - method_not_allowed
              - username_conflict
              - round_conflict
              - idempotency_conflict
              - turn_failed
              - attempt_version_conflict
              - request_too_large
              - rate_limited
              - generation_busy
              - internal_error
              - model_error
              - dependency_unavailable
              - model_unavailable
              - model_timeout
            message:
              type: string
              description: 受控展示文案，客户端不按文案分支。
            details:
              $ref: '#/components/schemas/TurnFailureDetails'
        request_id:
          $ref: '#/components/schemas/RequestId'
      description: 仅在发送轮次的 502/504/503 或 409 turn_failed 且失败轮次已确认落库时附 details；提交结果不明时省略。
    LiveHealth:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          const: alive
    ReadyHealth:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          const: ready
    NotReadyHealth:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          const: not_ready
      description: 503 就绪失败使用健康 JSON，不使用业务错误信封。
    UserResponse:
      type: object
      required:
      - data
      - request_id
      properties:
        data:
          $ref: '#/components/schemas/User'
        request_id:
          $ref: '#/components/schemas/RequestId'
    AuthResponse:
      type: object
      required:
      - data
      - request_id
      properties:
        data:
          $ref: '#/components/schemas/AuthData'
        request_id:
          $ref: '#/components/schemas/RequestId'
    TopicsResponse:
      type: object
      required:
      - data
      - request_id
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Topic'
        request_id:
          $ref: '#/components/schemas/RequestId'
    DebateResponse:
      type: object
      required:
      - data
      - request_id
      properties:
        data:
          $ref: '#/components/schemas/Debate'
        request_id:
          $ref: '#/components/schemas/RequestId'
    DebateListData:
      type: object
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Debate'
        total:
          type: integer
          minimum: 0
        page:
          $ref: '#/components/schemas/PositiveInteger'
        page_size:
          type: integer
          minimum: 1
          maximum: 50
    DebateListResponse:
      type: object
      required:
      - data
      - request_id
      properties:
        data:
          $ref: '#/components/schemas/DebateListData'
        request_id:
          $ref: '#/components/schemas/RequestId'
    TurnResponse:
      type: object
      required:
      - data
      - request_id
      properties:
        data:
          $ref: '#/components/schemas/TurnResultData'
        request_id:
          $ref: '#/components/schemas/RequestId'
    SummaryResponse:
      type: object
      required:
      - data
      - request_id
      properties:
        data:
          $ref: '#/components/schemas/SummaryStatus'
        request_id:
          $ref: '#/components/schemas/RequestId'
    DebateDetailResponse:
      type: object
      required:
      - data
      - request_id
      properties:
        data:
          type: object
          required:
          - debate
          - turns
          - summary_status
          properties:
            debate:
              $ref: '#/components/schemas/Debate'
            turns:
              type: array
              items:
                $ref: '#/components/schemas/Turn'
            summary_status:
              $ref: '#/components/schemas/SummaryStatus'
        request_id:
          $ref: '#/components/schemas/RequestId'
  responses:
    InvalidRequest:
      description: 非法参数、ID、JSON、媒体类型或字段限制。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorEnvelope'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - invalid_request
      x-error-codes:
      - invalid_request
    Unauthenticated:
      description: Session 缺失或已失效。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorEnvelope'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - unauthenticated
      x-error-codes:
      - unauthenticated
    InvalidCredentials:
      description: 用户名不存在与密码错误使用相同错误。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorEnvelope'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - invalid_credentials
      x-error-codes:
      - invalid_credentials
    CsrfFailed:
      description: Origin 或适用的 X-CSRF-Token 校验失败。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorEnvelope'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - csrf_failed
      x-error-codes:
      - csrf_failed
    NotFound:
      description: 辩题不可用，或会话不存在/不属于当前用户；会话缺失与越权使用相同提示。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorEnvelope'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - not_found
      x-error-codes:
      - not_found
    UsernameConflict:
      description: 归一化用户名已占用。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorEnvelope'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - username_conflict
      x-error-codes:
      - username_conflict
    TurnConflict:
      description: 状态或轮序不允许、同键内容/轮号不一致、已失败轮次重放；turn_failed 已确认失败时附 details。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorEnvelope'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - round_conflict
                      - idempotency_conflict
                      - turn_failed
      x-error-codes:
      - round_conflict
      - idempotency_conflict
      - turn_failed
    RetryTurnConflict:
      description: 轮次状态不允许重试，或失败轮次 attempt_version 已变化；attempt_version_conflict 附当前状态、版本与查询地址 details。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorEnvelope'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - round_conflict
                      - attempt_version_conflict
          example:
            error:
              code: attempt_version_conflict
              message: 请求未完成，请查看会话状态后再操作
              details:
                turn_id: '456'
                status: failed
                attempt_version: 2
                query_url: /api/v1/debates/123
            request_id: req-version-conflict
      x-error-codes:
      - round_conflict
      - attempt_version_conflict
    RequestTooLarge:
      description: 请求体超过 32 KiB。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorEnvelope'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - request_too_large
      x-error-codes:
      - request_too_large
    RateLimited:
      description: 请求频率超限；带 Retry-After 秒数。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorEnvelope'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - rate_limited
      x-error-codes:
      - rate_limited
    GenerationLimited:
      description: 请求频率/每日生成次数超限或用户/全局模型并发槽满；带 Retry-After 秒数。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorEnvelope'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - rate_limited
                      - generation_busy
      x-error-codes:
      - rate_limited
      - generation_busy
    InternalError:
      description: 受控内部错误，不回传堆栈或内部细节。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorEnvelope'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - internal_error
      x-error-codes:
      - internal_error
    ModelError:
      description: 模型失败、无效输出或拒答；确认失败轮次已保存时附 details。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorEnvelope'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - model_error
      x-error-codes:
      - model_error
    DependencyUnavailable:
      description: 存储不可用；提交结果不明时省略 details。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorEnvelope'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - dependency_unavailable
      x-error-codes:
      - dependency_unavailable
    GenerationUnavailable:
      description: 数据库不可用/提交结果不明，或供应商容量/额度不可用；确认失败已保存时附 details，否则省略。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorEnvelope'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - dependency_unavailable
                      - model_unavailable
      x-error-codes:
      - dependency_unavailable
      - model_unavailable
    ModelTimeout:
      description: 模型生成超时；确认失败轮次已保存时附 details。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorEnvelope'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - model_timeout
      x-error-codes:
      - model_timeout
    RouterNotFound:
      description: 当前未注册路径：404 not_found。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: not_found
              message: 接口不存在
            request_id: example-request-id
      x-error-codes:
      - not_found
    RouterMethodNotAllowed:
      description: 已注册路径不支持该方法：405 method_not_allowed。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: method_not_allowed
              message: 请求方法不支持
            request_id: example-request-id
      x-error-codes:
      - method_not_allowed
    RouterInternalError:
      description: 路由中间件捕获 panic：500 internal_error。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      x-error-codes:
      - internal_error
