      summary: 流式提交轮次（SSE，计划中）
      description: 请求体与 POST /api/v1/debates/{id}/turns 完全一致，响应改为 text/event-stream。
        必须复用同一认领内核（client_request_id 幂等、attempt_version、90 秒租约与并发配额），禁止另建幂等。
        鉴权/限流/校验失败仍返回普通 JSON；generating 期间重复请求返回 202 JSON。
        事件固定为 start（认领成功后，含 turn_id 与 request_id）、delta（增量文本）、done（最终事务提交成功后）、error（流内失败后关闭连接）。
        start 的 turn_id 定位轮次、request_id 关联请求，二者仅为恢复锚点；request_id 不是 client_request_id，不携带或代表 attempt_version。
        断线、error 或缺少 done 时先 GET /api/v1/debates/{id}，读取对应 Turn 最新 status/attempt_version；未收到 start 时按原 client_request_id 在 turns 中定位，未查到仍有限查询并提示稍后核实，不自动生成或换键。
        completed 读正式结果，generating 每 2 秒有限查询最多 120 秒，failed 才显示手动重试。用户明确重试时调用已有 /turns/{turn_id}/retry，expected_attempt_version 取查询到的失败版本，沿用 JSON 响应与查询，不重发 /turns/stream。
        202 继续查询，409 attempt_version_conflict 仅刷新状态，不自动换版本重发。总结版本来自总结状态查询，不能代替轮次版本。不做事件重放或断点续传。
      tags:
      - 辩论
      x-implementation-status: planned
      x-phase: S6
      security:
      - SessionCookie: []
        CsrfToken: []
      parameters:
      - $ref: '#/components/parameters/DebateId'
      - $ref: '#/components/parameters/Origin'
      x-max-request-body-bytes: 32768
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTurnRequest'
      responses:
        '200':
          description: 事件流。只有最终事务提交成功后才发送 done。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定 no-cache，禁止缓存事件流。
            X-Accel-Buffering:
              schema:
                type: string
              description: 固定 no，提示中间层关闭缓冲。
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: start
                data: {"turn_id":"42","request_id":"req-stream-example"}

                event: delta
                data: {"text":"对方认为"}

                event: done
                data: {"turn":{},"completed_rounds":3,"status":"active"}
        '202':
          description: 同一启动请求仍在生成中；返回普通 JSON，不进入事件流。
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TurnConflict'
        '429':
          $ref: '#/components/responses/GenerationLimited'
  /api/v1/debates/{id}/turns/{turn_id}/retry:
