        Phase 3 目标增量（尚未实现）支持可选 ai_style，省略默认 logical，显式 null、空串、非字符串或未知/大小写不符的枚举为 400 invalid_request 且不创建；校验后与会话一起保存并在响应、详情和历史返回，创建后不可修改。当前 Phase 2 仍固定 logical。
