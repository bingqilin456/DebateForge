# SSE 流式专用代理片段（独立完整，不 include proxy.conf）。
#
# 为什么不复用 proxy.conf：Nginx 在同一 location 内重复声明同类指令会直接报
# "directive is duplicate" 并拒绝启动，因此无法「先 include 通用片段、再覆盖超时」。
# 本片段因此完整声明 SSE 路由所需的上游指令，并在其中使用更适合长流的读取超时。
# 通用 /api/ 路由仍走 proxy.conf，两者互不影响。

# 不附加 URI，保留 /api/ 原路径、查询、上游状态及 Content-Type。
proxy_pass http://siyige_api;
proxy_intercept_errors off;
error_page 413 = @api_body_too_large;
proxy_next_upstream off;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For "";
proxy_set_header Forwarded "";
proxy_connect_timeout 3s;
proxy_send_timeout 10s;

# 关闭缓冲与压缩：否则 Nginx 会攒够一段才下发，前端无法逐步显示增量（AC12 硬性要求）。
# 同时关闭请求缓冲，避免分块提交体被攒齐后才转发。
proxy_buffering off;
proxy_request_buffering off;
gzip off;

# 长流读取超时取 75s，长于通用片段的 68s：
# 生成请求总预算 60s + 15s 心跳间隔 + 落库与写回余量。
# 读取超时指相邻读取间隔，不能替代应用侧总预算。
proxy_read_timeout 75s;

# SSE 依赖 keep-alive 持续推送，保持 HTTP/1.1 且不发送 Connection: close。
proxy_http_version 1.1;
proxy_set_header Connection "";

# 明确告知浏览器与中间层不要缓存事件流。
add_header Cache-Control "no-cache" always;
add_header X-Accel-Buffering "no" always;
