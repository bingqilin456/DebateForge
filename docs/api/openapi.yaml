# Phase 2 实现快照 + Phase 3 目标增量；ai_style 自主选择与 SSE 为计划契约，本轮仅改文档，详见 API.md。
openapi: 3.1.1
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: DebateForge（思弈阁）API 契约与实现核对
  version: phase3-contract-2026-11-14
  description: 文档快照日期 2026-11-14（Asia/Shanghai）。共 14 个操作已实现，另有 1 个计划操作（流式轮次 turns/stream，SSE）。
    已实现部分包含健康检查、T03 认证、T05 首轮、T09 轮次状态机与失败恢复（含显式重试与租约扫描）、T10 结构化总结与重试及 T11 本人历史分页接口。
    赛制自 2026-11-14 起由 debates.mode 驱动：quick_3 为三轮（历史兼容），standard_4 为四轮（新建默认），会话 DTO 增补 mode、ai_style、total_rounds。
    Phase 3 目标新增创建时自主 ai_style 选择（可选，缺省 logical，创建后不可改），尚未实现；当前创建仍固定 logical。SSE 最新版本从详情查询获取。
    默认关闭真实模型，可显式启用 Fake；健康路径为 /api/health/live、/api/health/ready。
servers:
- url: http://127.0.0.1:8080
  description: 本地后端默认地址；不代表当前进程已启动或生产已部署。
- url: http://127.0.0.1:5173
  description: Vite 开发代理，/api/ 原路径转发。
tags:
- name: 健康检查
  description: 当前已实现 /api/health/，已由项目负责人确认。
- name: 认证
  description: T03 已通过有条件独立审查和人工验收，原延期风险保留。
- name: 辩题
  description: T05 无收费范围独立复审 PASS、人工验收通过并结项，真实模型链路待另行授权验证。
- name: 辩论
  description: T05 无收费范围独立复审 PASS、人工验收通过并结项，真实模型链路待另行授权验证。
