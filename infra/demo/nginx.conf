pid /tmp/nginx.pid;
error_log stderr warn;
worker_processes 1;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    log_format api_413 '$status';
    upstream siyige_api { server app:8080; }
    server {
        listen 8080;
        server_name _;
        client_max_body_size 32k;
        root /usr/share/nginx/html;
        location ~ ^/api/v1/debates/[0-9]+/turns/stream$ {
            include /etc/nginx/siyige/proxy-sse.conf;
        }
        location /api/ {
            error_page 413 = @api_body_too_large;
            proxy_pass http://siyige_api;
            proxy_next_upstream off;
            proxy_intercept_errors off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 68s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
        }
        location @api_body_too_large {
            default_type application/json;
            return 413 '{"error":{"code":"request_too_large","message":"请求体超过大小限制"},"request_id":"$request_id"}';
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
