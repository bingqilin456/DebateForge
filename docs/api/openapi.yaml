                    status: generating
                    attempt_version: 1
                    error_code: null
                    messages:
                    - id: '901'
                      role: user
                      content: 开放式考核可以评估实际应用能力。
                      created_at: '2026-11-06T08:01:00Z'
                  completed_rounds: 0
                  query_url: /api/v1/debates/123
                request_id: req-pending
        '400':
          $ref: '#/components/responses/InvalidRequest'
